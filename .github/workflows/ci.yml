name: Thriftshoewear Dashboard CI/CD Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dashboard-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard-ci:
    name: Dashboard Test, Security, Build & E2E Gate (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: "Step 1/7: Static Linting (oxlint)"
        run: npm run lint

      - name: "Step 2/7: Unit, Contract, SSR & SEO Tests"
        run: npm test

      - name: "Step 3/7: Security Hardening Tests"
        run: npm run test:security

      - name: "Step 4/7: Production Next.js Webpack Build"
        run: npm run build

      - name: "Step 5/7: Bundle Size & Chunk Budget Gate (<500 KiB)"
        run: npm run test:bundle

      - name: "Step 6/7: Install Playwright Chromium"
        run: npx playwright install --with-deps chromium

      - name: "Step 7/7: Full E2E (All 24 Routes Smoke, 33 Responsive Viewports, RBAC, Logs & Zero-PII Storage)"
        run: npm run test:e2e
